name: Bug report
description: Report an issue with the CurbCharge integration or dashboard card.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Downloaded diagnostics are sanitized but may still contain provider and
        charging-status summaries and hashed station references. Review
        diagnostics, screenshots, and logs for personal information before
        attaching them. Never include credentials, API tokens, exact home
        coordinates, or unredacted diagnostics.
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: curbcharge_version
    attributes:
      label: CurbCharge version
      placeholder: "0.1.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. Configure CurbCharge with...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or diagnostics
      description: Remove coordinates, credentials, and personal information before posting.
      render: text
    validations:
      required: false
