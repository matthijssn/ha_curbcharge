name: Documentation
description: Report missing or unclear CurbCharge documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, exact home coordinates, or other personal information.
  - type: input
    id: page
    attributes:
      label: Which page or instructions need attention?
      placeholder: README installation section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
    validations:
      required: false
