name: Feature request
description: Suggest an improvement to CurbCharge.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, API tokens, exact home coordinates, or other personal information.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the use case and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
    validations:
      required: false
