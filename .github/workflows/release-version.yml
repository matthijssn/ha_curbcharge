name: Release version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to prepare (for example, v0.1.2)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify_tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag, manifest, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit(f"Tag {tag!r} is not stable SemVer")

          version = ".".join(match.groups())
          manifest = json.loads(
              Path("custom_components/curbcharge/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest["version"] != version:
              raise SystemExit(
                  f"Tag {tag} does not match manifest version {manifest['version']}"
              )

          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tag_sha = subprocess.check_output(
              ["git", "rev-parse", f"{tag}^{{commit}}"], text=True
          ).strip()
          if sha != tag_sha:
              raise SystemExit(f"Checkout SHA {sha} does not match {tag} ({tag_sha})")
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", "HEAD", "FETCH_HEAD"],
              check=True,
          )
          print(f"Verified {tag} ({sha}), manifest {version}, and main ancestry.")
          PY

      - name: Validate release integration archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_package.py build --tag "$RELEASE_TAG"
          python3 -m unittest discover -s tests -p test_release_package.py

      - name: Upload validated release ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: curbcharge-zip-${{ github.run_id }}
          path: dist/curbcharge.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  stage_draft_release:
    if: github.event_name == 'push'
    needs: verify_tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: curbcharge-zip-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact

      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ZIP_PATH: ${{ runner.temp }}/release-artifact/curbcharge.zip
        run: |
          set -euo pipefail
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "Refusing to modify published release $RELEASE_TAG."
              exit 1
            fi
            if jq -e '[.assets[].name] | index("curbcharge.zip") != null' <<<"$release_json" >/dev/null; then
              mkdir "$RUNNER_TEMP/existing-release-asset"
              gh release download "$RELEASE_TAG" --pattern curbcharge.zip \
                --dir "$RUNNER_TEMP/existing-release-asset"
              if ! cmp -s "$ZIP_PATH" "$RUNNER_TEMP/existing-release-asset/curbcharge.zip"; then
                echo "Draft release already has a different curbcharge.zip; refusing to replace it."
                exit 1
              fi
            else
              gh release upload "$RELEASE_TAG" "$ZIP_PATH"
            fi
          else
            version="${RELEASE_TAG#v}"
            gh release create "$RELEASE_TAG" "$ZIP_PATH" \
              --draft \
              --verify-tag \
              --title "CurbCharge $version" \
              --generate-notes
          fi
          echo "Draft release $RELEASE_TAG contains the validated curbcharge.zip."

  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit("Enter a stable SemVer tag such as v0.1.2")

          target_version = tuple(map(int, match.groups()))
          manifest_path = Path("custom_components/curbcharge/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          current_match = re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              manifest["version"],
          )
          if current_match is None:
              raise SystemExit("The manifest version is not stable SemVer")

          existing_versions = [
              tuple(map(int, match.groups()))
              for existing_tag in subprocess.check_output(
                  ["git", "tag", "--list"], text=True
              ).splitlines()
              if (
                  match := re.fullmatch(
                      r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
                      existing_tag,
                  )
              )
          ]
          current_version = tuple(map(int, current_match.groups()))
          latest_version = max([current_version, *existing_versions])
          if target_version <= latest_version:
              raise SystemExit(
                  f"{tag} must be newer than the manifest and all existing release tags"
              )

          branch = f"release/{tag}"
          existing_branch = subprocess.check_output(
              [
                  "git",
                  "ls-remote",
                  "--heads",
                  "origin",
                  f"refs/heads/{branch}",
              ],
              text=True,
          )
          if existing_branch.strip():
              raise SystemExit(f"Branch {branch} already exists")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tag={tag}\n")
              output.write(f"version={'.'.join(map(str, target_version))}\n")
              output.write(f"branch={branch}\n")
          PY

      - name: Create manifest version branch
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git switch --create "$RELEASE_BRANCH"
          python3 - "$RELEASE_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("custom_components/curbcharge/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = sys.argv[1]
          path.write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/curbcharge/manifest.json
          git commit -m "chore: prepare release $RELEASE_TAG"
          git push --set-upstream origin "$RELEASE_BRANCH"
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${RELEASE_BRANCH}?expand=1"
          {
            echo "## Release manifest prepared"
            echo
            echo "- Requested tag: \`$RELEASE_TAG\`"
            echo "- Manifest version: \`$RELEASE_VERSION\`"
            echo
            echo "Review and merge the release PR: [$compare_url]($compare_url)"
            echo "After merging, create the GitHub release using tag \`$RELEASE_TAG\` from \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"

  verify_published:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tag matches manifest and main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)",
              tag,
          )
          if match is None:
              raise SystemExit(f"Published tag {tag!r} is not stable SemVer")

          expected_version = ".".join(match.groups())
          manifest = json.loads(
              Path("custom_components/curbcharge/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest["version"] != expected_version:
              raise SystemExit(
                  f"Tag {tag} does not match manifest version {manifest['version']}"
              )

          subprocess.run(
              ["git", "fetch", "origin", "main"],
              check=True,
          )
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", "HEAD", "FETCH_HEAD"],
              check=True,
          )
          print(f"Verified {tag}, manifest {expected_version}, and main ancestry.")
          PY

      - name: Revalidate published integration archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,assets)"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "false" \
            || "$(jq -r '.isPrerelease' <<<"$release_json")" != "false" ]]; then
            echo "Expected a published stable release for $RELEASE_TAG."
            exit 1
          fi
          if ! jq -e '[.assets[].name] | index("curbcharge.zip") != null' <<<"$release_json" >/dev/null; then
            echo "Published release $RELEASE_TAG has no curbcharge.zip asset."
            exit 1
          fi
          mkdir "$RUNNER_TEMP/published-release"
          gh release download "$RELEASE_TAG" --pattern curbcharge.zip \
            --dir "$RUNNER_TEMP/published-release"
          python3 scripts/release_package.py validate \
            "$RUNNER_TEMP/published-release/curbcharge.zip" \
            --tag "$RELEASE_TAG"
          python3 -m unittest discover -s tests -p test_release_package.py
