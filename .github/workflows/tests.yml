name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up minimum supported Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install minimum Home Assistant test environment
        run: >
          pip install
          --constraint https://raw.githubusercontent.com/home-assistant/core/2024.12.0/homeassistant/package_constraints.txt
          pytest-homeassistant-custom-component==0.13.190
      - name: Test minimum Home Assistant version
        run: pytest
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: node --test tests/curbcharge-card.test.mjs
      - name: Test with coverage threshold
        run: pytest --cov=custom_components/curbcharge --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=96
      - name: Reject coverage decreases
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No prior commit is available for coverage comparison."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (
            cd "$RUNNER_TEMP/base"
            pytest --cov=custom_components/curbcharge --cov-report=json:"$RUNNER_TEMP/coverage-base.json"
          )
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          base = json.loads(
              Path(os.environ["RUNNER_TEMP"], "coverage-base.json").read_text()
          )["totals"]["percent_covered"]
          current = json.loads(Path("coverage.json").read_text())["totals"][
              "percent_covered"
          ]
          if current < base:
              raise SystemExit(
                  f"Coverage decreased from {base:.2f}% to {current:.2f}%"
              )
          print(f"Coverage did not decrease ({base:.2f}% -> {current:.2f}%).")
          PY
      - run: mypy
