name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up minimum supported Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install minimum Home Assistant test environment
        run: >
          pip install
          --constraint https://raw.githubusercontent.com/home-assistant/core/2024.12.0/homeassistant/package_constraints.txt
          pytest-homeassistant-custom-component==0.13.190
          pycares==4.8.0
      - name: Test minimum Home Assistant 2024.12.0
        run: pytest
      - name: Set up current supported Python 3.14.2
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
      - name: Install current Home Assistant 2026.10.4 test environment
        run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: node --test tests/curbcharge-card.test.mjs
      - name: Test Home Assistant 2026.10.4 with coverage threshold
        env:
          PYTHONWARNINGS: default
        run: pytest --cov=custom_components/curbcharge --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=96
      - name: Enforce per-module coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          modules = {
              path: report["summary"]["percent_covered"]
              for path, report in coverage["files"].items()
              if path.startswith("custom_components/curbcharge/")
              and path.endswith(".py")
          }
          if not modules:
              raise SystemExit("No CurbCharge Python modules were included in coverage.json")

          below_threshold = {
              path: percent for path, percent in modules.items() if percent <= 95.0
          }
          if below_threshold:
              details = "\n".join(
                  f" - {path}: {percent:.2f}%"
                  for path, percent in sorted(below_threshold.items())
              )
              raise SystemExit(
                  "Every CurbCharge module must exceed 95% coverage:\n" + details
              )
          print(f"All {len(modules)} CurbCharge modules exceed 95% coverage.")
          PY
      - name: Reject coverage decreases
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No prior commit is available for coverage comparison."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (
            cd "$RUNNER_TEMP/base"
            pytest --cov=custom_components/curbcharge --cov-report=json:"$RUNNER_TEMP/coverage-base.json"
          )
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          base = json.loads(
              Path(os.environ["RUNNER_TEMP"], "coverage-base.json").read_text()
          )["totals"]["percent_covered"]
          current = json.loads(Path("coverage.json").read_text())["totals"][
              "percent_covered"
          ]
          if current < base:
              raise SystemExit(
                  f"Coverage decreased from {base:.2f}% to {current:.2f}%"
              )
          print(f"Coverage did not decrease ({base:.2f}% -> {current:.2f}%).")
          PY
      - run: mypy
