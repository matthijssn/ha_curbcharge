rules:
  action_setup:
    status: exempt
    comment: CurbCharge is read-only and registers no service actions.
  appropriate_polling: done
  brands: done
  common_modules: done
  config_flow: done
  config_flow_test_coverage: done
  dependency_transparency: done
  docs_actions:
    status: exempt
    comment: CurbCharge does not provide service actions.
  docs_conditions:
    status: exempt
    comment: CurbCharge does not provide conditions.
  docs_high_level_description: done
  docs_installation_instructions: done
  docs_removal_instructions: done
  docs_triggers:
    status: exempt
    comment: CurbCharge does not provide triggers.
  entity_event_setup: done
  entity_unique_id: done
  has_entity_name: done
  runtime_data: done
  test_before_configure: done
  test_before_setup: done
  unique_config_entry: done
  action_exceptions:
    status: exempt
    comment: CurbCharge does not register service actions.
  config_entry_unloading: done
  docs_configuration_parameters: done
  docs_installation_parameters: done
  entity_unavailable: done
  integration_owner: done
  log_when_unavailable: done
  parallel_updates: done
  reauthentication_flow:
    status: exempt
    comment: NDW DOT-NL's public data API requires no credentials.
  test_coverage: done
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: This cloud data provider has no local discovery protocol; users select a location and stations are discovered from NDW DOT-NL.
  discovery_update_info:
    status: exempt
    comment: Charging stations are cloud records, not network devices with Home Assistant connection information to update.
  docs_data_update: done
  docs_examples: done
  docs_known_limitations: done
  docs_supported_devices: done
  docs_supported_functions: done
  docs_troubleshooting: done
  docs_use_cases: done
  dynamic_devices: done
  entity_category: done
  entity_device_class: done
  entity_disabled_by_default: done
  entity_translations: done
  exception_translations: done
  icon_translations: done
  reconfiguration_flow: done
  repair_issues:
    status: exempt
    comment: There are no credential or hardware faults requiring manual repair; network errors recover automatically and location changes use the reconfigure flow.
  stale_devices: done
  async_dependency: done
  inject_websession: done
  strict_typing: done
